name: Bug
description: Report a reproducible defect using synthetic data
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Never include secrets or real candidate data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include safe logs, error codes, and screenshots.
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression test and rollback
    validations:
      required: true
