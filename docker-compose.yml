services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-only}
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/talent-intelligence-realm.json:/opt/keycloak/data/import/talent-intelligence-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talent_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-talent_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-talent_intelligence}
      DB_USER: ${POSTGRES_USER:-talent_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      SECURITY_ISSUER_URI: http://localhost:8180/realms/talent-intelligence
      SECURITY_JWK_SET_URI: http://keycloak:8080/realms/talent-intelligence/protocol/openid-connect/certs
      SECURITY_AUDIENCE: talent-intelligence-api
      SOURCE_FINGERPRINT_KEY: ${SOURCE_FINGERPRINT_KEY:-local-synthetic-fingerprint-key-change-in-production}
      SOURCE_FINGERPRINT_KEY_VERSION: ${SOURCE_FINGERPRINT_KEY_VERSION:-local-v1}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /opt/onnxruntime:rw,exec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "3000:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  keycloak-data:
  postgres-data:
